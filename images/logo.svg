<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a44"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d77a"/>
      <stop offset="1" stop-color="#b8862b"/>
    </linearGradient>
  </defs>

  <!-- background tile -->
  <rect x="8" y="8" width="384" height="384" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="384" height="384" rx="56" fill="none" stroke="url(#gold)" stroke-width="10"/>

  <!-- ranked load-time bars -->
  <rect x="56" y="250" width="200" height="24" rx="6" fill="#e05a4f"/>
  <rect x="56" y="284" width="150" height="24" rx="6" fill="#e0943a"/>
  <rect x="56" y="318" width="96"  height="24" rx="6" fill="#4AA7FF"/>

  <!-- stopwatch -->
  <rect x="223" y="44" width="34" height="22" rx="5" fill="url(#gold)"/>
  <rect x="234" y="62" width="12" height="16" fill="url(#gold)"/>
  <circle cx="240" cy="160" r="88" fill="#16233a" stroke="url(#gold)" stroke-width="14"/>
  <g stroke="#9fb3cf" stroke-width="6" stroke-linecap="round">
    <line x1="240" y1="88"  x2="240" y2="102"/>
    <line x1="312" y1="160" x2="298" y2="160"/>
    <line x1="240" y1="232" x2="240" y2="218"/>
    <line x1="168" y1="160" x2="182" y2="160"/>
  </g>
  <line x1="240" y1="160" x2="282" y2="118" stroke="#e05a4f" stroke-width="9" stroke-linecap="round"/>
  <circle cx="240" cy="160" r="10" fill="url(#gold)"/>
</svg>
